name: Камчатка · 3D город
on:
  push:
    branches: ['Neverrie/**']
  pull_request:
    paths:
      - 'city_sim/**'
      - 'snowops/**'
      - 'winter_audit/relief.py'
      - 'weather_coverage/geography.py'
      - 'Dockerfile.city-sim*'
      - 'compose.city-sim.yml'
      - 'requirements-city-sim.txt'
      - '.github/workflows/city-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-city-sim.txt
      - run: python -m pip install -r requirements-city-sim.txt
      - name: Check out the pinned snow solver
        run: |
          mkdir -p city_sim/.state/danil
          git -C city_sim/.state/danil init
          git -C city_sim/.state/danil fetch --depth=1 https://github.com/NDaVS/kamcha-snow-sim.git 367282af2b5e728f6cdd94c148065c4cec892cfd
          git -C city_sim/.state/danil checkout --detach FETCH_HEAD
      - run: python -m unittest discover -s city_sim/tests -v
      - run: docker compose -f compose.city-sim.yml up --build --detach --wait
      - run: |
          test "$(docker compose -f compose.city-sim.yml ps --services --status running | sort | paste -sd ' ' -)" = "city-api city-web"
          curl -fsS -o /dev/null http://127.0.0.1:8008/openapi.json
          curl -fsS -o /dev/null http://127.0.0.1:8008/api/v1/operations/weather
          curl -fsS -H 'Content-Type: application/json' -d '{"resolution": 64}' http://127.0.0.1:8008/api/v1/operations/snow -o "$RUNNER_TEMP/snow-study.json"
          python -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["directional_control"]["passes"] and m["metrics"]["calm_flat_pass"]' "$RUNNER_TEMP/snow-study.json"
          python -m city_sim.reproduce_city_snow --event december-2025 --output "$RUNNER_TEMP/citywide-snow"
          python -c 'import json,sys; m=json.load(open(sys.argv[1]))[0]["metrics"]; assert m["computed_tiles"] == m["eligible_tiles"] and m["road_m_covered"] > 100000' "$RUNNER_TEMP/citywide-snow/manifest.json"
          curl -fsS -o /dev/null http://127.0.0.1:8008/api/v1/city/metadata
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/maplibre-gl.js
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/three.module.min.js
      - if: always()
        run: docker compose -f compose.city-sim.yml logs && docker compose -f compose.city-sim.yml down
