name: Камчатка · 3D город
on:
  push:
    branches: ['Neverrie/**']
  pull_request:
    paths:
      - 'city_sim/**'
      - 'snowops/**'
      - 'winter_audit/relief.py'
      - 'weather_coverage/geography.py'
      - 'Dockerfile.city-sim*'
      - 'compose.city-sim.yml'
      - 'requirements-city-sim.txt'
      - '.github/workflows/city-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-city-sim.txt
      - run: python -m pip install -r requirements-city-sim.txt
      - run: python -m unittest discover -s city_sim/tests -v
      - run: docker compose -f compose.city-sim.yml up --build --detach --wait
      - run: |
          curl -fsS http://127.0.0.1:8008/api/v1/city/metadata
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/maplibre-gl.js
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/three.module.min.js
      - if: always()
        run: docker compose -f compose.city-sim.yml logs && docker compose -f compose.city-sim.yml down
