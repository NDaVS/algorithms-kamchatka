<main><h1>Точный расчёт MILP (v1)</h1><p>Загрузите JSON сценария v1.0. Точность относится только к заданной математической модели и каталогу при статусе exact_top_k; не подтверждает законность. При add, relocate и frontier включается безопасный preset.</p><p><a href="/">Вернуться к приблизительному legacy</a></p><label>JSON запроса <input type="file" id="input" accept=".json,application/json"></label> <button id="run" disabled>Рассчитать</button><p id="status" role="status"></p><pre id="output" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></main><script type="module" src="/exact.js"></script></body></html>
