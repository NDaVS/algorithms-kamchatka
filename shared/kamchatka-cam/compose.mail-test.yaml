services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - test-mail:/data
    environment:
      MP_DATABASE: /data/mailpit.db
  worker:
    environment:
      MONITOR_MAIL_TEST: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_USER: ""
      SMTP_PASSWORD: ""

volumes:
  test-mail:
