name: kamchatka

x-application: &application
  image: kamchatka-monitoring:${APP_VERSION:-dev}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: "host=db port=5432 dbname=monitor user=monitor password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    MEDIA_DIR: /app/runtime/media
  volumes:
    - media:/app/runtime/media
    - ./runtime/demo:/app/runtime/demo:ro
  depends_on:
    db:
      condition: service_healthy
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=128m,mode=1777

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor -d monitor"]
      interval: 3s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  api:
    <<: *application
    build: .
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *application
    command: [python, -m, monitoring.worker]
    stop_grace_period: 45s
    restart: 'on-failure:5'

volumes:
  postgres:
  media:
