services:
  object-store:
    image: chrislusf/seaweedfs:4.54
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-kamchatka-frames}
    volumes:
      - object-data:/data
    restart: unless-stopped

volumes:
  object-data:
